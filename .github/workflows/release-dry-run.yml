name: Release (dry run)

# A rehearsal of publishing the Docker image. It is launched by hand only, and it publishes NOTHING: it has no login to
# any registry and no permission to write packages. The image is pushed to a throwaway registry that runs inside the job
# and disappears with it, pulled back from there, and tested. What it cannot check is the login and the permissions of the
# real registry (ghcr.io), which is only known by publishing for real.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse (the image gets this tag; `latest` is added only to versions without a suffix)
        required: true
        default: 0.0.1-beta.1
      platforms:
        description: Platforms to build
        required: true
        default: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # The throwaway registry. It is only reachable from this job.
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      VERSION: ${{ inputs.version }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The version '$VERSION' is not a semantic version (for example 0.0.1-beta.1)." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # network=host lets the builder reach the registry that runs next to the job on localhost:5000.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: localhost:5000/vault
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push to the throwaway registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Pull the image back from the registry
        run: docker pull "localhost:5000/vault:$VERSION"

      - name: Smoke test of the pulled image
        run: bash scripts/smoke-test.sh "localhost:5000/vault:$VERSION"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: System tests on the pulled image
        env:
          VAULT_SYSTEM_IMAGE: localhost:5000/vault:${{ inputs.version }}
        run: dotnet run --project tests/Vault.SystemTests -c Release

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Release dry run: $VERSION"
            echo
            echo "**Nothing was published.** The image went to a registry that lives only inside this job."
            echo
            echo "Tags it would get:"
            echo '```'
            echo "$TAGS" | sed 's#localhost:5000/vault#ghcr.io/javixulo/vault#'
            echo '```'
            echo "Platforms: \`$PLATFORMS\`"
            echo
            echo "Manifest as pushed to the throwaway registry:"
            echo '```'
            docker buildx imagetools inspect "localhost:5000/vault:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
